Server:
  port: 8089
  forward-headers-strategy: framework

spring:
  application:
    name: member-service
  profiles:
    active: dev

  #  data:
  #    mongodb:
  #      uri: mongodb+srv://...
  #      auto-index-creation: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  config:
    import: optional:file:.env[.properties]

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true

JWT:
  secret-key: ${JWT_SECRET_KEY}
  token:
    access-expire-time: 1800000000
    refresh-expire-time: 1209600000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html

